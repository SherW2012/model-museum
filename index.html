;z-index:2;pointer-events:none;color:#a0a0a8;font-size:12px;letter-spacing:.1em;text-align:center}#status[hidden]{display:none}@media(max-width:860px){main{min-height:680px}header{height:72px}.details{top:112px;transform:none;max-width:280px}.details h2{font-size:37px;margin:6px 0}.details p{font-size:12px}.details .edition{margin-top:8px}.details .small{display:none}.rail{top:40%;right:16px}.bottom{bottom:25px}.hint{bottom:190px}footer{bottom:7px;font-size:9px}}@media(max-width:520px){header{padding:0 21px}.header-note{display:none}.details{left:22px;top:92px;max-width:200px}.details h2{font-size:29px;letter-spacing:-.055em}.details p{display:none}.details .edition{font-size:11px}.rail{top:38%;gap:9px}.icon-btn{height:38px;min-width:38px;border-radius:12px}.bottom{width:calc(100% - 24px);padding:14px 14px 11px;border-radius:21px}.brand-tabs{gap:15px}.brand-tabs button{font-size:11px}.selectors{display:block;margin-top:10px}.models{justify-content:center}.models button{font-size:11px;padding:7px 10px}.swatches{justify-content:center;margin-top:10px}.color-label{text-align:center;padding-top:6px}.hint{bottom:195px;font-size:10px}footer{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

<body>
<main id="main">
  <header><div><div class="eyebrow">3D COLLECTION / PERSONAL STUDY</div><h1 id="heading">iPhone 18 Pro Max</h1></div><span class="header-note">非商业 · 独立设计研究</span></header>
  <div id="viewport" role="img" aria-label="可用鼠标或触摸旋转缩放的手机三维模型"></div>
  <div id="status" role="status">正在加载 3D 展示…<br><small>需要网络连接以加载 Three.js</small></div>
  <section class="details" aria-label="机型信息"><div class="kicker" id="brand-tag">APPLE / PRO SERIES</div><h2 id="model-title">iPhone<br>18 Pro Max</h2><p>探索设备外观、镜头结构与金属质感。拖拽旋转，滚轮或双指缩放。</p><div class="edition" id="edition">外观研究 · 交互式 3D</div><div class="small">示意模型 · 非官方精确尺寸 / CAD 数据</div></section>
  <div class="rail" role="toolbar" aria-label="3D 查看选项">
    <button class="icon-btn" id="front" aria-label="查看正面" title="正面"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M10 5h4"/></svg></button>
    <button class="icon-btn" id="back" aria-label="查看背面" title="背面"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><circle cx="10" cy="8" r="2"/><circle cx="15" cy="10" r="2"/></svg></button>
    <button class="icon-btn" id="rotate" aria-label="自动旋转" aria-pressed="false" title="自动旋转"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4M4 4v4h4M4 13a8 8 0 0 0 14.7 4M20 20v-4h-4"/></svg></button>
    <button class="icon-btn" id="zoom" aria-label="镜头特写" aria-pressed="false" title="镜头特写"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M10 7v6M7 10h6"/></svg></button>
    <button class="icon-btn" id="fullscreen" aria-label="全屏展示" title="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
  </div>
  <div class="hint">拖拽旋转 · 滚轮 / 双指缩放</div>
  <section class="bottom" aria-label="选择品牌、机型及颜色"><nav class="brand-tabs" id="brands" aria-label="品牌"></nav><div class="selectors"><div class="models" id="models" aria-label="机型"></div><div class="swatches" id="colors" aria-label="颜色"></div></div><div class="color-label" id="color-label">—</div></section>
  <footer>个人非商业设计与 Web 3D 研究。外观为程序重建的示意模型，非品牌官方展示。</footer>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const CATALOG = {
  Apple:{label:'Apple',series:'PRO SERIES',models:[{name:'iPhone 18 Pro Max',short:'18 Pro Max',width:2.40,height:5.02,thick:.31,camera:'triangle',colors:[['深空黑','#38393d'],['钛金灰','#a4a09a'],['星光银','#dedcd5'],['深海蓝','#536a80']]},{name:'iPhone 18 Pro',short:'18 Pro',width:2.21,height:4.57,thick:.31,camera:'triangle',colors:[['深空黑','#38393d'],['钛金灰','#a4a09a'],['星光银','#dedcd5'],['深海蓝','#536a80']]}]},
  Xiaomi:{label:'Xiaomi',series:'ULTRA SERIES',models:[{name:'Xiaomi 17 Ultra',short:'17 Ultra',width:2.37,height:4.85,thick:.34,camera:'round',colors:[['经典黑','#343536'],['珍珠白','#e6e4df'],['松石绿','#6f9689']]}]},
  Huawei:{label:'Huawei',series:'PURA SERIES',models:[{name:'HUAWEI Pura 90 Pro Max',short:'Pura 90 Pro Max',width:2.39,height:4.92,thick:.32,camera:'pura',colors:[['曜金黑','#282728'],['雪域白','#eae8e1'],['绯云红','#9c5a5c'],['苍山绿','#6e8179'],['流光紫','#9b90af']]}]},
  Samsung:{label:'Samsung',series:'GALAXY S SERIES',models:[{name:'Galaxy S26 Ultra',short:'S26 Ultra',width:2.43,height:5.05,thick:.29,camera:'separate',colors:[['钛影黑','#39393c'],['钛雾银','#bbb9b5'],['钛灰蓝','#73879a'],['钛紫','#92879d']]}]}
};
const state={brand:'Apple',model:0,color:0,spinning:false,macro:false};
const $=id=>document.getElementById(id);const viewport=$('viewport');
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(32,1,.1,100);camera.position.set(5.2,2.6,10.8);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;viewport.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xb7b9c4,2.15));function light(x,y,z,power,size){const l=new THREE.DirectionalLight(0xffffff,power);l.position.set(x,y,z);scene.add(l)}light(-4,7,9,3);light(5,3,-7,2.5);light(8,-4,5,1.1);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=false;controls.minDistance=4.2;controls.maxDistance=19;controls.minPolarAngle=.18;controls.maxPolarAngle=Math.PI-.18;controls.target.set(0,0,0);
let phone=new THREE.Group();scene.add(phone);let cameraTarget=new THREE.Vector3(0,0,0);let goalDistance=11.9;let viewTween=null;
const metal=(color,rough=.24)=>new THREE.MeshPhysicalMaterial({color,metalness:.75,roughness:rough,clearcoat:.92,clearcoatRoughness:.16});
const glass=new THREE.MeshPhysicalMaterial({color:0x090c12,metalness:.4,roughness:.09,clearcoat:1,clearcoatRoughness:.035,side:THREE.DoubleSide});
function roundShape(w,h,r){const s=new THREE.Shape();const x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function plate(w,h,r,depth,z,material,x=0,y=0){const g=new THREE.ExtrudeGeometry(roundShape(w,h,r),{depth,bevelEnabled:false,curveSegments:12});const m=new THREE.Mesh(g,material);m.position.set(x,y,z);phone.add(m);return m}
function disk(radius,depth,material,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,depth,56),material);m.rotation.x=Math.PI/2;m.position.set(x,y,z);phone.add(m);return m}
function lens(x,y,z,r=.245){disk(r+.06,.028,metal(0x77787b,.17),x,y,z);disk(r+.035,.033,new THREE.MeshStandardMaterial({color:0x151923,metalness:.8,roughness:.13}),x,y,z+.025);disk(r*.79,.036,glass,x,y,z+.054);disk(r*.52,.038,new THREE.MeshPhysicalMaterial({color:0x141a28,metalness:.9,roughness:.08,clearcoat:1}),x,y,z+.077);disk(r*.23,.04,new THREE.MeshBasicMaterial({color:0x07090d}),x,y,z+.101);const glint=new THREE.Mesh(new THREE.CircleGeometry(r*.12,24),new THREE.MeshBasicMaterial({color:0x7194bd,transparent:true,opacity:.44,depthWrite:false}));glint.position.set(x-r*.16,y+r*.18,z+.124);phone.add(glint)}
function tiny(x,y,z,r,bright=false){disk(r,.024,new THREE.MeshPhysicalMaterial({color:bright?0xf7f2d9:0x161b20,metalness:.4,roughness:.18}),x,y,z)}
function wallpaper(){const c=document.createElement('canvas');c.width=256;c.height=512;const ctx=c.getContext('2d');const g=ctx.createLinearGradient(0,0,256,512);g.addColorStop(0,'#050812');g.addColorStop(.36,'#253455');g.addColorStop(.67,'#9e6878');g.addColorStop(1,'#d9a6a2');ctx.fillStyle=g;ctx.fillRect(0,0,256,512);for(let i=0;i<4;i++){const v=ctx.createRadialGradient(70+i*65,85+i*75,10,110+i*25,160+i*80,200);v.addColorStop(0,'rgba(243,199,190,.35)');v.addColorStop(1,'rgba(10,14,35,0)');ctx.fillStyle=v;ctx.fillRect(0,0,256,512)}return new THREE.CanvasTexture(c)}
const screenTexture=wallpaper();screenTexture.colorSpace=THREE.SRGBColorSpace;
function disposePhone(){scene.remove(phone);phone.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if(m!==glass)m.dispose()})}});phone=new THREE.Group();scene.add(phone)}
function buildPhone(){disposePhone();const m=CATALOG[state.brand].models[state.model];const col=m.colors[state.color][1];const w=m.width,h=m.height,t=m.thick,corner=state.brand==='Samsung'?.13:.28;const frame=metal(col,.21);plate(w,h,corner,t,-t/2,frame);plate(w-.08,h-.08,corner-.035,.016,t/2+.006,metal(col,.3));plate(w-.09,h-.09,corner-.04,.011,-t/2-.017,new THREE.MeshPhysicalMaterial({color:0x141414,metalness:.5,roughness:.12,clearcoat:1}));plate(w-.15,h-.15,corner-.055,.012,-t/2-.032,new THREE.MeshBasicMaterial({map:screenTexture}));
  // Notch and front camera: on the outward-facing screen plane.
  plate(.55,.105,.053,.01,-t/2-.046,new THREE.MeshBasicMaterial({color:0x090b11}),0,h/2-.245);
  const s=metal(col,.24);const z=t/2+.027;
  function island(x,y,iw,ih,r){plate(iw,ih,r,.063,z,s,x,y);return z+.076}
  if(m.camera==='triangle'){
    const x=-w/2+.69,y=h/2-.80;const top=island(x,y,1.25,1.31,.23);lens(x-.31,y+.32,top,.235);lens(x+.31,y+.32,top,.235);lens(x-.31,y-.33,top,.235);tiny(x+.29,y-.34,top+.03,.10,true);tiny(x+.31,y-.03,top+.03,.09)
  }else if(m.camera==='round'){
    const x=0,y=h/2-.99;disk(.85,.075,metal(0x303238,.19),x,y,z+.08);disk(.75,.02,metal(0x15181b,.13),x,y,z+.13);lens(x-.32,y+.30,z+.18,.21);lens(x+.32,y+.30,z+.18,.21);lens(x-.32,y-.30,z+.18,.21);lens(x+.32,y-.30,z+.18,.21);tiny(x,y,z+.21,.08,true)
  }else if(m.camera==='pura'){
    const x=0,y=h/2-1.05;const top=island(x,y,1.73,1.62,.47);disk(.65,.035,metal(0x27292c,.2),x,y,top+.01);lens(x-.35,y+.25,top+.07,.22);lens(x+.36,y+.25,top+.07,.22);lens(x,y-.34,top+.07,.22);tiny(x,y+.17,top+.12,.08,true)
  }else{
    const x=-w/2+.47,y=h/2-.56;const dz=z+.06;lens(x,y,dz,.235);lens(x,y-.67,dz,.235);lens(x,y-1.34,dz,.235);lens(x+.64,y-.36,dz,.17);tiny(x+.64,y-.83,dz,.10,true)
  }
  // Side buttons, charging opening, and antenna breaks.
  const buttonMat=metal(col,.29);const side=new THREE.Mesh(new THREE.BoxGeometry(.042,.60,.12),buttonMat);side.position.set(w/2+.02,h*.19,0);phone.add(side);const power=side.clone();power.scale.y=.65;power.position.set(-w/2-.02,h*.21,0);phone.add(power);const port=new THREE.Mesh(new THREE.BoxGeometry(.35,.012,.105),new THREE.MeshBasicMaterial({color:0x16181b}));port.position.set(0,-h/2-.003,0);phone.add(port);phone.rotation.set(-.075,.04,-.04);updateLabels();
}
function updateLabels(){const b=CATALOG[state.brand],m=b.models[state.model];$('heading').textContent=m.name;$('brand-tag').textContent=`${b.label.toUpperCase()} / ${b.series}`;$('model-title').innerHTML=m.name.replace(/^HUAWEI /,'').replace(/^iPhone /,'iPhone<br>').replace(/^Xiaomi /,'Xiaomi<br>').replace(/^Galaxy /,'Galaxy<br>').replace(/^Pura /,'Pura<br>');$('color-label').textContent=m.colors[state.color][0]+' · 示意配色';$('edition').textContent='外观研究 · 交互式 3D';renderControls()}
function renderControls(){const b=$('brands'),models=$('models'),colors=$('colors');b.replaceChildren();models.replaceChildren();colors.replaceChildren();for(const key of Object.keys(CATALOG)){const button=document.createElement('button');button.textContent=CATALOG[key].label;button.setAttribute('aria-selected',String(key===state.brand));button.setAttribute('role','tab');button.addEventListener('click',()=>{state.brand=key;state.model=0;state.color=0;state.macro=false;buildPhone();resetView()});b.appendChild(button)}b.setAttribute('role','tablist');const chosen=CATALOG[state.brand];chosen.models.forEach((m,i)=>{const button=document.createElement('button');button.textContent=m.short;button.setAttribute('aria-pressed',String(i===state.model));button.addEventListener('click',()=>{state.model=i;state.color=0;state.macro=false;buildPhone();resetView()});models.appendChild(button)});chosen.models[state.model].colors.forEach(([name,hex],i)=>{const button=document.createElement('button');button.style.setProperty('--swatch',hex);button.title=name;button.setAttribute('aria-label',name);button.setAttribute('aria-pressed',String(i===state.color));button.addEventListener('click',()=>{state.color=i;buildPhone()});colors.appendChild(button)});$('zoom').setAttribute('aria-pressed',String(state.macro))}
function changeView(type){state.macro=false;$('zoom').setAttribute('aria-pressed','false');const distance=11.7;if(type==='front')tweenCamera(new THREE.Vector3(0,.7,-distance),new THREE.Vector3());else tweenCamera(new THREE.Vector3(4,.9,distance),new THREE.Vector3())}
function tweenCamera(position,target){viewTween={start:camera.position.clone(),end:position.clone(),from:controls.target.clone(),to:target.clone(),t:0};controls.autoRotate=false;state.spinning=false;$('rotate').setAttribute('aria-pressed','false')}
function resetView(){state.macro=false;$('zoom').setAttribute('aria-pressed','false');tweenCamera(new THREE.Vector3(5.2,2.6,10.8),new THREE.Vector3())}
$('front').addEventListener('click',()=>changeView('front'));$('back').addEventListener('click',()=>changeView('back'));
$('rotate').addEventListener('click',()=>{state.spinning=!state.spinning;viewTween=null;controls.autoRotate=state.spinning;controls.autoRotateSpeed=1.2;$('rotate').setAttribute('aria-pressed',String(state.spinning))});
$('zoom').addEventListener('click',()=>{state.macro=!state.macro;$('zoom').setAttribute('aria-pressed',String(state.macro));if(state.macro){const m=CATALOG[state.brand].models[state.model];tweenCamera(new THREE.Vector3(-1.5,m.height/2-.68,3.8),new THREE.Vector3(-.42,m.height/2-.75,0))}else resetView()});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('main').requestFullscreen()}catch(e){console.warn('Fullscreen unavailable',e)}});
function resize(){const rect=viewport.getBoundingClientRect();camera.aspect=Math.max(.1,rect.width/Math.max(1,rect.height));camera.fov=camera.aspect<.72?45:32;camera.updateProjectionMatrix();renderer.setSize(rect.width,rect.height,false)}new ResizeObserver(resize).observe(viewport);resize();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.06);if(viewTween){viewTween.t=Math.min(1,viewTween.t+dt*2.6);const t=1-Math.pow(1-viewTween.t,3);camera.position.lerpVectors(viewTween.start,viewTween.end,t);controls.target.lerpVectors(viewTween.from,viewTween.to,t);if(viewTween.t>=1)viewTween=null}controls.update();renderer.render(scene,camera)}
buildPhone();$('status').hidden=true;animate();
</script>
